name: Spring Boot → Ubuntu Server 배포 (Blue-Green)

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 + Gradle 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lineofduty:latest

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, ubuntu-server]
    permissions:
      contents: read
      packages: read

    steps:
      - name: GHCR 로그인 (PAT 사용)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 환경 변수 파일(.env) 생성
        run: |
          rm -f .env
          touch .env

          # 1. 데이터베이스 설정
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DDL_AUTO=update" >> .env

          # 2. Redis 설정
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env

          # 3. JWT / 보안 설정
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }}" >> .env
          echo "ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}" >> .env

          # 4. 메일 설정
          echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" >> .env
          echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env

          # 5. 카카오 OAuth 설정
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
          echo "KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}" >> .env

          # 6. 프론트엔드 URL
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env

          # 7. 외부 API 설정
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "TOSS_SECRET_KEY=${{ secrets.TOSS_SECRET_KEY }}" >> .env
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> .env

          # 8. MinIO 설정
          echo "MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}" >> .env
          echo "MINIO_PUBLIC_ENDPOINT=${{ secrets.MINIO_PUBLIC_ENDPOINT }}" >> .env
          echo "MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}" >> .env
          echo "MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}" >> .env
          echo "MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}" >> .env

          # 9. 기타
          echo "TZ=Asia/Seoul" >> .env
          echo "SERVER_FORWARD_HEADERS_STRATEGY=framework" >> .env

      - name: Blue-Green 무중단 배포
        run: |
          set -e
          NETWORK=lineofduty
          IMAGE=ghcr.io/${{ github.repository_owner }}/lineofduty:latest

          echo "📥 최신 이미지 다운로드 중..."
          docker pull $IMAGE

          # 현재 떠있는 색 확인 → 반대 색으로 배포
          if docker inspect lineofduty-blue > /dev/null 2>&1; then
            OLD_COLOR=blue
            NEW_COLOR=green
          elif docker inspect lineofduty-green > /dev/null 2>&1; then
            OLD_COLOR=green
            NEW_COLOR=blue
          else
            OLD_COLOR=""
            NEW_COLOR=blue
          fi
          echo "🎨 기존: ${OLD_COLOR:-없음} → 신규: $NEW_COLOR"

          docker rm -f lineofduty-$NEW_COLOR 2>/dev/null || true

          echo "🚀 신규 컨테이너($NEW_COLOR) 실행 중..."
          docker run -d \
            --name lineofduty-$NEW_COLOR \
            --restart always \
            --network $NETWORK \
            --env-file .env \
            $IMAGE

          echo "🩺 헬스체크 대기 중..."
          IP=$(docker inspect -f '{{ (index .NetworkSettings.Networks "'"$NETWORK"'").IPAddress }}' lineofduty-$NEW_COLOR)
          SUCCESS=false
          for i in $(seq 1 18); do
            if curl -sf -o /dev/null "http://$IP:8080/actuator/health"; then
              SUCCESS=true
              break
            fi
            echo "  ...대기 중 ($i/18)"
            sleep 5
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ 헬스체크 실패 - 배포 중단, 기존 버전 유지"
            docker logs lineofduty-$NEW_COLOR --tail 100 || true
            docker stop lineofduty-$NEW_COLOR || true
            docker rm lineofduty-$NEW_COLOR || true
            exit 1
          fi

          echo "✅ 헬스체크 통과 - nginx 트래픽 전환"
          echo "server lineofduty-$NEW_COLOR:8080;" > $HOME/nginx/conf.d/upstream.conf
          docker exec nginx nginx -s reload

          if [ -n "$OLD_COLOR" ]; then
            echo "🧹 기존 컨테이너($OLD_COLOR) 정리 중... (30초 유예)"
            docker stop --time 30 lineofduty-$OLD_COLOR || true
            docker rm lineofduty-$OLD_COLOR || true
          fi

          docker image prune -f
